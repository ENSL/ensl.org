plugins:
  # rubocop-rails adds Rails-specific cops that understand controller, model,
  # and routing conventions better than the core Ruby cops alone.
  - rubocop-rails

AllCops:
  NewCops: disable
  TargetRubyVersion: 3.4
  # Allow RuboCop to suggest optional extensions without auto-enabling them.
  SuggestExtensions: true

  # Not required for linting.
  Exclude:
    - 'bin/**/*'
    - 'db/schema.rb'
    - 'db/migrate/**/*'
    - 'vendor/**/*'
    - 'node_modules/**/*'
    - 'tmp/**/*'
    - 'log/**/*'
    - 'coverage*/**/*'
    - 'config/**/*'
    - 'lib/plugins/**/*'
    # LogFile#NON_ASCII is a legacy byte-range regex (`/[\x80-\xff]/`) combined
    # with an `# encoding: US-ASCII` magic comment. `ruby -c` confirms this
    # parses fine under Ruby 3.4 -- this is RuboCop's own `parser` gem
    # misreporting a valid regex as an invalid multibyte escape (Lint/Syntax
    # can't be selectively disabled per-cop, so the whole legacy/WIP file is
    # excluded here instead of rewriting otherwise-working parsing).
    - 'app/models/log_file.rb'

# Controllers (and many Rails classes) read perfectly well above the
# general-purpose Ruby defaults; these thresholds keep a guardrail without
# forcing actions to be shattered into many tiny private methods.
# The point is to keep methods understandable, not to optimize for a generic
# Ruby style guide that is too strict for Rails controllers.
Metrics/AbcSize:
  Enabled: true
  Max: 30

# Rails actions often carry a moderate amount of branching and setup, so a
# slightly higher limit avoids artificial method splitting.
Metrics/MethodLength:
  Enabled: true
  Max: 18

# Controllers commonly branch on request state, parameters, and feature flags;
# this ceiling keeps the logic readable while still permitting practical actions.
Metrics/CyclomaticComplexity:
  Enabled: true
  Max: 9

# Perceived complexity is a better fit for readable Rails controller code than
# the default conservative threshold.
Metrics/PerceivedComplexity:
  Enabled: true
  Max: 10

# Class-level size is allowed to be larger than the Ruby default because Rails
# controllers, concerns, and service objects can accumulate coherent behavior.
Metrics/ClassLength:
  Enabled: true
  Max: 200

Metrics/BlockLength:
  # Test files and DSL-heavy configuration files naturally contain long blocks
  # that are meaningful and should not be micromanaged by this cop.
  Exclude:
    - 'spec/**/*'
    # Routes files are declarative DSL, so large blocks there are expected.
    - 'config/routes.rb'
    # Task definitions often need longer blocks for clarity and grouped setup.
    - 'lib/tasks/**/*'

Metrics:
  Enabled: false

# Rails controllers and concerns are self-documenting by convention; a top-level
# comment on every class/module is noise.
Style/Documentation:
  Enabled: false

# before_action callbacks frequently target actions defined in included modules
# or engines, which this cop cannot see; it produces false positives here.
# Disabling it avoids warning on a common Rails pattern that is valid but hard
# for static analysis to trace reliably.
Rails/LexicallyScopedActionFilter:
  Enabled: false

# API controllers intentionally subclass ActionController::API via their own base.
# Excluding them prevents false positives where the base controller hierarchy is
# intentionally different from the default Rails HTML stack.
Rails/ApplicationController:
  Exclude:
    - 'app/controllers/api/**/*'

# Staging is a deployed Rails environment in this application and has its own
# config/environments/staging.rb; Rails/UnknownEnv does not infer it reliably.
Rails/UnknownEnv:
  Environments:
    - development
    - test
    - production
    - staging

# LogLine is part of the legacy/WIP log-ingestion subsystem (along with
# LogFile and Round/Rounder) that predates the validation conventions used
# elsewhere in the app; its update_attribute calls are intentional shortcuts,
# not oversights. spec/factories bulk-insert with insert_all! for performance
# (large fixture datasets), challenge_spec and the listed gather/user specs use
# update_column(s) to bypass callbacks or validations when arranging test state
# -- all are deliberate, not missed validations.
Rails/SkipsModelValidations:
  Exclude:
    - 'app/models/log_line.rb'
    - 'spec/factories/**/*'
    - 'spec/models/challenge_spec.rb'
    - 'spec/features/gathers/gather_header_badge_spec.rb'
    - 'spec/features/gathers/gather_started_at_spec.rb'
    - 'spec/features/users/user_login_spec.rb'
    - 'spec/models/gather_spec.rb'
    - 'spec/models/user_spec.rb'
    - 'spec/requests/users_spec.rb'

# Rounder#ensl_team is part of the same legacy/WIP round-tracking subsystem as
# Round and LogLine. Team intentionally has no reciprocal `has_many :rounders`,
# so there is no association to point `inverse_of` at.
Rails/InverseOf:
  Exclude:
    - 'app/models/rounder.rb'

# Safety::DatabaseGuard intentionally hard-stops the boot/rake/spec process
# with exit() to block destructive db tasks or misconfigured environments
# before Rails finishes loading. That's a deliberate CLI safety measure, not
# the mid-request server exit this cop is meant to guard against.
Rails/Exit:
  Exclude:
    - 'lib/safety/database_guard.rb'
