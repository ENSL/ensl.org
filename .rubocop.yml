plugins:
  # rubocop-rails adds Rails-specific cops that understand controller, model,
  # and routing conventions better than the core Ruby cops alone.
  - rubocop-performance
  - rubocop-rails
  - rubocop-rake
  - rubocop-rspec
  - rubocop-rspec_rails
  - rubocop-capybara
  - rubocop-factory_bot

AllCops:
  NewCops: disable
  TargetRubyVersion: 3.4
  # Allow RuboCop to suggest optional extensions without auto-enabling them.
  SuggestExtensions: true

  # Not required for linting.
  Exclude:
    - 'bin/**/*'
    - 'db/schema.rb'
    - 'db/migrate/**/*'
    - 'vendor/**/*'
    - 'node_modules/**/*'
    - 'tmp/**/*'
    - 'log/**/*'
    - 'coverage*/**/*'
    - 'config/**/*'
    - 'lib/plugins/**/*'

# Controllers (and many Rails classes) read perfectly well above the
# general-purpose Ruby defaults; these thresholds keep a guardrail without
# forcing actions to be shattered into many tiny private methods.
# The point is to keep methods understandable, not to optimize for a generic
# Ruby style guide that is too strict for Rails controllers.
Metrics/AbcSize:
  Enabled: false
  Max: 30

# Rails actions often carry a moderate amount of branching and setup, so a
# slightly higher limit avoids artificial method splitting.
Metrics/MethodLength:
  Enabled: false
  Max: 18

# Controllers commonly branch on request state, parameters, and feature flags;
# this ceiling keeps the logic readable while still permitting practical actions.
Metrics/CyclomaticComplexity:
  Enabled: false
  Max: 9

# Perceived complexity is a better fit for readable Rails controller code than
# the default conservative threshold.
Metrics/PerceivedComplexity:
  Enabled: false
  Max: 10

# Class-level size is allowed to be larger than the Ruby default because Rails
# controllers, concerns, and service objects can accumulate coherent behavior.
Metrics/ClassLength:
  Enabled: false
  Max: 200

Metrics/BlockLength:
  # Test files and DSL-heavy configuration files naturally contain long blocks
  # that are meaningful and should not be micromanaged by this cop.
  Exclude:
    - 'spec/**/*'
    # Routes files are declarative DSL, so large blocks there are expected.
    - 'config/routes.rb'
    # Task definitions often need longer blocks for clarity and grouped setup.
    - 'lib/tasks/**/*'

Metrics:
  Enabled: false

# Rails controllers and concerns are self-documenting by convention; a top-level
# comment on every class/module is noise.
Style/Documentation:
  Enabled: false

# before_action callbacks frequently target actions defined in included modules
# or engines, which this cop cannot see; it produces false positives here.
# Disabling it avoids warning on a common Rails pattern that is valid but hard
# for static analysis to trace reliably.
Rails/LexicallyScopedActionFilter:
  Enabled: false

# API controllers intentionally subclass ActionController::API via their own base.
# Excluding them prevents false positives where the base controller hierarchy is
# intentionally different from the default Rails HTML stack.
Rails/ApplicationController:
  Exclude:
    - 'app/controllers/api/**/*'

# Staging is a deployed Rails environment in this application and has its own
# config/environments/staging.rb; Rails/UnknownEnv does not infer it reliably.
Rails/UnknownEnv:
  Environments:
    - development
    - test
    - production
    - staging

# spec/factories bulk-insert with insert_all! for performance (large fixture
# datasets), challenge_spec and the listed gather/user specs use
# update_column(s) to bypass callbacks or validations when arranging test state
# -- all are deliberate, not missed validations.
Rails/SkipsModelValidations:
  Exclude:
    - 'spec/factories/**/*'
    - 'spec/models/challenge_spec.rb'
    - 'spec/features/gathers/gather_header_badge_spec.rb'
    - 'spec/features/gathers/gather_started_at_spec.rb'
    - 'spec/features/users/user_login_spec.rb'
    - 'spec/models/gather_spec.rb'
    - 'spec/models/user_spec.rb'
    - 'spec/requests/users_spec.rb'

# Safety::DatabaseGuard intentionally hard-stops the boot/rake/spec process
# with exit() to block destructive db tasks or misconfigured environments
# before Rails finishes loading. That's a deliberate CLI safety measure, not
# the mid-request server exit this cop is meant to guard against.
Rails/Exit:
  Exclude:
    - 'lib/safety/database_guard.rb'

# This suite uses RSpec integration tests extensively. The following cops prefer
# unit-test patterns that would obscure setup, increase duplication, or require
# brittle controller implementation stubs in these existing feature/request
# tests. Keep the broader RSpec/Rails cops enabled while accepting these
# established, readable conventions.
# Rails actions often instantiate their own records, so some request/controller
# failure-path specs must intercept behavior on those internally created
# instances. Replacing these globally scoped stubs needs explicit injection
# seams in the application, not a mechanical test rewrite.
RSpec/AnyInstance:
  Enabled: false

# Rake task definitions register globally and must be loaded once. Reloading
# them before each example is unnecessary and can duplicate task registration.
RSpec/BeforeAfterAll:
  Exclude:
    - 'spec/lib/tasks/parquet_imports_spec.rb'

# Feature and request specs describe user workflows, routes, and externally
# visible behavior rather than one Ruby class. Requiring a class/module as the
# first description would make those examples less accurate.
RSpec/DescribeClass:
  Enabled: false

# Long-running feature scenarios sometimes share browser/session state through
# instance variables. Replacing it with lazy helpers would obscure execution
# order and make the narrative setup harder to follow.
RSpec/InstanceVariable:
  Enabled: false

# Integration specs deliberately create records before navigation or requests;
# eager `let!` keeps that prerequisite close to its name and avoids repetitive
# before hooks in each scenario.
RSpec/LetSetup:
  Enabled: false

# Pre-action message expectations remain useful for interactions that must
# occur exactly once. The suite permits both that style and post-action spies
# instead of forcing every collaborator test into one form.
RSpec/MessageSpies:
  Enabled: false

# A feature file can contain several independent top-level workflows. Forcing
# them under one artificial parent makes the descriptions and failure output
# less useful to someone reading the feature as a user journey.
RSpec/MultipleDescribes:
  Enabled: false

# Some tests deliberately combine an interaction assertion with its configured
# return value. Replacing each one with allow/have_received is a behavior-aware
# migration and would add noise unless the separate interaction assertion adds
# real value to that example.
RSpec/StubbedMock:
  Enabled: false

# Many remaining doubles model dynamic Active Record relations or lightweight
# roles, not a concrete Ruby class with a stable public interface to verify.
# A few controller specs also exercise legacy action collaborators whose called
# methods are not model instance methods. Keep these plain until those boundaries
# are given explicit interfaces; do not invent a verifying class merely for lint.
RSpec/VerifiedDoubles:
  Enabled: false

# These cops measure test structure, not correctness. Feature scenarios often
# need several observable assertions, nested contexts, and setup helpers to
# express a complete workflow without splitting it into opaque micro-examples.

RSpec/ExampleLength:
  Enabled: false

RSpec/MultipleExpectations:
  Enabled: false

RSpec/NestedGroups:
  Enabled: false

RSpec/MultipleMemoizedHelpers:
  Enabled: false


# This legacy calendar scenario is intentionally disabled while the widget is
# redesigned; it remains as a feature fixture and is not named as an active spec.
RSpec/SpecFilePathSuffix:
  Exclude:
    - 'spec/features/calendar/google_calendar_widget.rb'

# The log parser is an operational utility, intentionally outside the current
# application lint cleanup scope.
Performance/FixedSize:
  Exclude:
    - 'script/rails_log_parser.rb'
