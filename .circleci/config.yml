version: 2.1

references:
  default_docker_ruby_executor: &default_docker_ruby_executor
    image: cimg/ruby:3.4.8-browsers
    environment:
      BUNDLE_JOBS: '3'
      BUNDLE_RETRY: '3'
      BUNDLE_PATH: vendor/bundle
      BUNDLER_VERSION: '4.0.6'
      RACK_ENV: test
      RAILS_ENV: test
      MYSQL_HOST: '127.0.0.1'
      MYSQL_DATABASE: 'ensl_test'
      MYSQL_USER: 'ensl'
      MYSQL_PASSWORD: 'ensl'
      MYSQL_CONNECTION_POOL: '16'
  mariadb: &mariadb
    image: mariadb:10.7
    environment:
      MYSQL_DATABASE: ensl_test
      MYSQL_USER: ensl
      MYSQL_PASSWORD: ensl
      MYSQL_ROOT_PASSWORD: ensl
      MYSQL_ROOT_HOST: "%"

orbs:
  qlty-orb: qltysh/qlty-orb@0.0

jobs:
  test:
    parallelism: 3
    docker:
      - *default_docker_ruby_executor
      - *mariadb
    steps:
      - run:
          name: Checkout via HTTPS
          command: |
            REPO_HTTPS="${CIRCLE_REPOSITORY_URL/git@github.com:/https://github.com/}"
            if [ "$REPO_HTTPS" = "$CIRCLE_REPOSITORY_URL" ]; then
              REPO_HTTPS="https://github.com/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}.git"
            fi
            git clone --filter=blob:none "$REPO_HTTPS" .
            git checkout --force "$CIRCLE_SHA1"
      - run:
          name: Install system packages for native gems
          command: |
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              libmariadb-dev \
              libmariadb-dev-compat \
              libmagickwand-dev \
              imagemagick
      - run:
          name: Install Bundler
          command: gem install bundler -v "$BUNDLER_VERSION"
      - restore_cache:
          keys:
            - ensl-bundle-v4-{{ arch }}-{{ checksum "Gemfile.lock" }}
            - ensl-bundle-v4-{{ arch }}-
      - run:
          name: Bundle Install
          command: bundle check || bundle install
      - run:
          name: Install Playwright Chromium and dependencies
          command: npx -y playwright@1.58.2 install --with-deps chromium
      - save_cache:
          key: ensl-bundle-v4-{{ arch }}-{{ checksum "Gemfile.lock" }}
          paths:
            - vendor/bundle
      - run:
          name: Wait for DB
          command: |
            for i in $(seq 1 60); do
              (echo > /dev/tcp/127.0.0.1/3306) >/dev/null 2>&1 && exit 0
              sleep 2
            done
            echo "MariaDB did not become ready in time"
            exit 1
      - run:
          name: Database setup
          command: bundle exec bin/rails db:prepare
      # Run rspec in parallel
      - run:
          command: |
            mkdir /tmp/test-results
            TESTFILES=$(circleci tests glob "spec/**/*_spec.rb" | circleci tests split --split-by=timings)
            SIMPLECOV=1 bundle exec rspec $TESTFILES --profile 10 --format progress
      # Qlty Coverage Orb
      - qlty-orb/coverage_publish:
          files: coverage/coverage.json
      - store_artifacts:
          path: /tmp/test-results
          destination: test-results

workflows:
  version: 2
  build_and_test:
    jobs:
      - test
