# Default rails_best_practices checks, with controller unused-method checking
# disabled because it flags Rails routes, callbacks, and helper_method dispatch.
MoveCodeIntoHelperCheck:
  array_count: 3
MoveCodeIntoModelCheck:
  use_count: 2
MoveModelLogicIntoModelCheck:
  use_count: 4
NeedlessDeepNestingCheck:
  nested_count: 2
OveruseRouteCustomizationsCheck:
  customize_count: 3
RemoveUnusedMethodsInHelpersCheck:
  except_methods: []
RemoveUnusedMethodsInModelsCheck:
  except_methods:
    - "DataFile#second_directory"
    - "DataFile#manual_upload"
    - "DataFile#refresh_preview_links!"
    - "DataFile#sync_download_plan"
    - "DataFile#find_existing"
    - "DataFile#can_update?"
    - "DataFile#can_destroy?"
    - "Directory#find_by_file_count"
    - "Directory#find_by_inode_and_verify"
    - "Issue#status_s"
    - "Match#demo_name"
    - "Round#winner_s"
    - "Teamer#api_v1_member_payload"
    # Verified in use (controllers/views/helpers/services/specs) - the gem's call-graph
    # can't resolve calls dispatched through an association (e.g. Gatherer#gather.foo!)
    # or bare self-calls from an included concern (Gather#states from
    # GatherActivityTracking#activity_value).
    - "Gather#states"
    - "Gather#previous_gather"
    - "Gather#next_gather"
    - "Gather#open_for_join?"
    - "Gather#start_voting_if_full!"
    - "Gather#notify_interested_users_if_threshold_reached!"
    - "Gather#voting_time_remaining"
    - "Gather#refresh_and_broadcast_if_status_changed!"
    - "Gather#advance_picking_after_pick!"
    - "Gather#picking_slot_available?"
    - "Gather#bump_version!"
    - "Gather#can_create?"
    - "Gather#can_update?"
    - "Gather#admin_update"
ReplaceComplexCreationWithFactoryMethodCheck:
  attribute_assignment_count: 2
