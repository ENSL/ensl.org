name: Test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  id-token: write # Required for Qlty OIDC coverage upload

jobs:
  rspec:
    # Runs on the self-hosted runner (containerized, Docker-outside-of-Docker)
    # registered on the app server.
    runs-on: [self-hosted, linux, x64]
    env:
      # Force a project name distinct from whatever production/staging use,
      # so this never attaches to (or tears down) their db/redis containers,
      # networks, or volumes — regardless of what directory this checks out into.
      COMPOSE_PROJECT_NAME: ensl_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix workspace ownership
        # The runner checks out as uid 1001, while app containers run as uid
        # 1000 (web:web). Prepare outputs before handing the tree to the app.
        run: |
          docker run --rm -v "$PWD:/workspace" alpine:3.22 sh -c '
            mkdir -p /workspace/tmp/test-results /workspace/coverage
            chown -R 1000:1000 /workspace
          '

      - name: Build test image
        run: docker compose --profile test build test

      - name: Run test suite
        run: |
          docker compose --profile test run --rm test bash -c '
            for i in $(seq 1 30); do
              bundle exec bin/rails db:prepare && break
              echo "Waiting for database... ($i/30)"
              sleep 2
            done
            bundle exec rspec --force-color --format progress --format RspecJunitFormatter --out tmp/test-results/rspec.xml
          '

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: RSpec Results
          path: tmp/test-results/rspec.xml
          reporter: java-junit
          fail-on-error: true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Publish coverage to Qlty
        if: always()
        uses: qltysh/qlty-action/coverage@v2
        with:
          oidc: true
          files: coverage/coverage.json

      - name: Tear down containers
        if: always()
        run: docker compose --profile test down -v --remove-orphans
