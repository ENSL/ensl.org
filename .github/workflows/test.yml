name: Test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  id-token: write # Required for Qlty OIDC coverage upload

jobs:
  rspec:
    # Runs on the self-hosted runner (containerized, Docker-outside-of-Docker)
    # registered on the app server.
    runs-on: [self-hosted, linux, x64]
    env:
      # Force a project name distinct from whatever production/staging use,
      # so this never attaches to (or tears down) their db/redis containers,
      # networks, or volumes — regardless of what directory this checks out into.
      COMPOSE_PROJECT_NAME: ensl_ci
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Fix workspace ownership
        # Keep the checkout and .git owned by the runner (uid 1001). Only
        # runtime paths need to be writable by the app (uid 1000) or MariaDB.
        run: |
          docker run --rm -v "$PWD:/workspace" alpine:3.22 sh -c '
            mkdir -p \
              /workspace/log \
              /workspace/tmp/test-results \
              /workspace/coverage \
              /workspace/public/assets \
              /workspace/public/local \
              /workspace/public/files \
              /workspace/spec/fixtures/files/videos \
              /workspace/app/assets/builds \
              /workspace/db/data
            chown -R 1000:1000 \
              /workspace/log \
              /workspace/tmp \
              /workspace/coverage \
              /workspace/public/assets \
              /workspace/public/local \
              /workspace/public/files \
              /workspace/spec/fixtures/files/videos \
              /workspace/app/assets/builds
          '
          docker run --rm -u root \
            -v "$PWD/db/data:/var/lib/mysql" \
            mariadb:10.7 sh -c 'chown -R mysql:mysql /var/lib/mysql'

      - name: Build test image
        run: docker compose --profile test build test

      - name: Run test suite
        run: |
          docker compose --profile test run --rm test bash -c '
            rm -rf coverage
            for i in $(seq 1 30); do
              bundle exec bin/rails db:prepare && break
              echo "Waiting for database... ($i/30)"
              sleep 2
            done
            SIMPLECOV=1 bundle exec rspec --force-color --format progress --format RspecJunitFormatter --out tmp/test-results/rspec.xml
          '

      - name: Publish test results
        uses: dorny/test-reporter@3eeb9fc888e82e8be2fb356bbeec2750231672bc # v1
        if: ${{ always() && hashFiles('tmp/test-results/rspec.xml') != '' }}
        with:
          name: RSpec Results
          path: tmp/test-results/rspec.xml
          reporter: java-junit
          fail-on-error: true

      - name: Upload coverage report
        if: ${{ always() && hashFiles('coverage/coverage.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Verify coverage file exists
        if: ${{ always() }}
        run: |
          test -f coverage/coverage.json
          ls -lah coverage

      - name: Publish coverage to Qlty
        if: ${{ always() && hashFiles('coverage/coverage.json') != '' }}
        uses: qltysh/qlty-action/coverage@08a0a862c159eae9b9003081da6663d96efef637 # v2
        with:
          oidc: true
          files: coverage/coverage.json
          format: simplecov
          verbose: true
          skip-errors: false

      - name: Tear down containers
        if: always()
        run: docker compose --profile test down -v --remove-orphans

      - name: Restore runner ownership
        if: always()
        # Leave the persistent checkout writable for the next checkout/clean.
        run: docker run --rm -v "$PWD:/workspace" alpine:3.22 chown -R 1001:121 /workspace

  qlty_check:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Qlty CLI
        uses: qltysh/qlty-action/install@08a0a862c159eae9b9003081da6663d96efef637 # v2

      - name: Run Qlty check
        continue-on-error: true
        run: qlty check --all
